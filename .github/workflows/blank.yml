name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git make clang llvm \
            lz4 zstd zip unzip bc cpio flex bison perl python3 \
            libssl-dev libelf-dev libncurses-dev liblz4-tool \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b ares-t-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Integrate ReSukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          make ares_defconfig
          make -j$(nproc) 2>&1 | tee kernel.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: kernel/arch/arm64/boot/Image.gz-dtb

